<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sweet Solace — Online Memorial Websites</title><meta name="description" content="Create a beautiful online memorial website to preserve and share memories of your loved one."><meta property="og:type" content="website"><meta property="og:title" content="Sweet Solace — Online Memorial Websites"><meta property="og:description" content="Preserve and share memories of your loved one."><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕊️</text></svg>">

<body class="bg-white dark:bg-neutral-950 text-slate-700 dark:text-neutral-200"><form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden><input name="name"><input name="email"><textarea name="message"></textarea><input name="bot-field"></form><div id="app"></div>
<script>
const SITE={email:'admin@karatechnix.com',addr:'Main Street, Brown’s Town, St. Ann, Jamaica'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const SEED=[['bruce-warburton','Bruce Warburton',1948,2026,'Family'],['richard-john-parrott','Richard John Parrott',1965,2026,'Veteran'],['francis-zvomuya','Dr. Francis Zvomuya',1964,2026,'Community hero'],['nguby-naz-ngu','Nguby Naz Ngu',1969,2026,'Family'],['jinny-henson','Jinny Henson',1950,2026,'Family'],['margaret-ellis','Margaret Ellis',1938,2025,'Community hero'],['theodore-p-hill','Theodore P. Hill',1943,2026,'Veteran'],['claire-bennett','Claire Bennett',1990,2025,'Family']].map(a=>({id:a[0],name:a[1],b:a[2],d:a[3],cat:a[4],story:'A beloved presence in the lives of everyone who knew them. Friends and family gather here to share photos, stories and love — and to keep their memory shining.'}));
const CATS=['COVID-19 victims','Veterans','First responders','Substance abuse victims','Cancer victims','Victims of an accident','Crime victims','Miscarriage, stillborn and infant loss','Child loss'];
let S={q:'',f:'All',draft:{},user:null};
const DB={list:null,rec:{},det:{},seen:new Set()};
const api=async(p,o={})=>{const r=await fetch('/api/'+p,{method:o.method||'GET',credentials:'same-origin',headers:o.body?{'Content-Type':'application/json'}:{},body:o.body?JSON.stringify(o.body):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(j.error||'Something went wrong. Please try again.'),{status:r.status});return j};
const me=async()=>{try{S.user=(await api('me')).email||null}catch(e){S.user=null}};
const loadList=async()=>{try{DB.list=(await api('memorials')).list}catch(e){DB.list=DB.list||[]}};
const loadDetail=async id=>{try{const q=DB.seen.has(id)?'':'?visit=1';DB.seen.add(id);const r=await api('memorials/'+encodeURIComponent(id)+q);DB.det[id]=r.stats;if(r.m)DB.rec[id]=r.m;else delete DB.rec[id]}catch(e){delete DB.rec[id];delete DB.det[id]}};
const mems=()=>[...(DB.list||[]),...SEED],data=()=>DB.det;
const getM=id=>DB.rec[id]||mems().find(q=>q.id==id);
const fmsg=(f,t)=>{let p=f.querySelector('.fmsg');if(!p){p=document.createElement('p');p.className='fmsg text-sm text-red-600 sm:col-span-2';f.appendChild(p)}p.textContent=t};
const hue=n=>[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
const av=(n,c='h-40',p)=>p?`<img src='${p}' alt='${esc(n)}' class='${c} w-full object-cover'>`:`<div class="${c} w-full flex items-center justify-center text-4xl font-semibold text-white" style="background:linear-gradient(135deg,hsl(${hue(n)} 55% 62%),hsl(${(hue(n)+40)%360} 60% 45%))">${esc(n.replace(/^Dr\. /,'').split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>`;
const card=m=>`<a href="#memorial-${m.id}" class="block rounded-2xl overflow-hidden border border-sky-100 dark:border-neutral-700 bg-white dark:bg-neutral-900 shadow-md hover:shadow-xl hover:-translate-y-1 transition">${av(m.name,'h-40',m.pic)}<div class="p-4"><h3 class="font-semibold text-sky-950 dark:text-white">${esc(m.name)}</h3><p class="text-xs text-slate-500">${m.b} – ${m.d} · ${esc(m.cat)}</p></div></a>`;
const btn='inline-block rounded-lg bg-sky-500 hover:bg-sky-600 text-white font-bold tracking-widest text-sm px-7 py-3.5 shadow-lg shadow-sky-200 dark:shadow-none transition cursor-pointer text-center';
const inp='mt-1.5 w-full rounded-lg border border-sky-200 dark:border-neutral-700 bg-sky-50/50 dark:bg-neutral-800 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400';
const fld=(l,n,t='text',ph='',req=1)=>`<div><label class="text-sm font-semibold text-sky-950 dark:text-neutral-100">${l}${req?' <span class="text-sky-500">*</span>':''}</label><input name="${n}" type="${t}" ${req?'required':''} placeholder="${ph}" value="${esc(S.draft[n]||'')}" class="${inp}"></div>`;
const hero=(eyebrow,h,p)=>`<section class="bg-gradient-to-b from-sky-200/70 via-white to-white dark:from-sky-950 dark:via-neutral-950 dark:to-neutral-950 py-14 sm:py-20 text-center px-4"><div class="max-w-3xl mx-auto fade"><p class="text-xs font-bold tracking-[0.2em] uppercase text-sky-600">${eyebrow}</p><h1 class="mt-2 text-3xl sm:text-5xl font-semibold tracking-tight text-sky-950 dark:text-white">${h}</h1><p class="mt-4 text-slate-500 dark:text-neutral-400">${p}</p></div></section>`;
const sec=(c,cls='')=>`<section class="py-12 sm:py-16 ${cls}"><div class="max-w-6xl mx-auto px-4 sm:px-6 fade">${c}</div></section>`;
const h2=t=>`<h2 class="text-center text-lg sm:text-xl font-bold tracking-[0.15em] uppercase text-sky-950 dark:text-white mb-8">${t}</h2>`;
const nameForm=(id,cta)=>`<form data-f="hero" class="mt-6 flex flex-col sm:flex-row gap-3 max-w-xl mx-auto"><input name="first_name" required placeholder="First Name" aria-label="First name" class="${inp} mt-0"><input name="last_name" required placeholder="Last Name" aria-label="Last name" class="${inp} mt-0"><button class="${btn}">${cta}</button></form>`;
const TEST=[['April','I think it’s amazing to have a place to honor a loved one that doesn’t cost a fortune to keep going. It’s always there for me to add more things and let other people do the same — all of those memories in one place forever.'],['Marcus','Setting it up for my father took ten minutes. Now cousins from three countries add stories every week.'],['Denise','The candle feature gives our family a quiet way to be together on anniversaries, even from far away.'],['Samuel','Affordable, simple and beautiful. Exactly what we needed after a very hard year.']];
const PLANS=[['Free','$0','Start today',['Memorial page with portrait & dates','Life story & photo gallery','Candles & tributes','Shareable link']],['Lifetime','$99','One-time, forever',['Everything in Free','Unlimited photos & videos','Birthday & anniversary reminders','Kept online for generations','Priority support']],['Family','$149','One-time, forever',['Everything in Lifetime','Up to 5 linked memorials','Invite co-editors','Printable memorial book']]];
const POSTS=[['Writing a eulogy that feels like them','Start with a single story that only they could have lived. Then add the small habits — the laugh, the recipe, the phrase — that made them unmistakable. A eulogy doesn’t have to be perfect; it has to be true.'],['How to invite family to a memorial page','Share one link by message or email, then add a personal note explaining that anyone can light a candle or leave a tribute. Older relatives often prefer a short, friendly walkthrough.'],['Remembering on anniversaries and birthdays','Dates can be heavy. Many families light a candle, share a favorite photo and invite others to post a memory — turning a hard day into a gathering.']];
const RES=[['Grief support','Talk to a local counsellor, faith leader or support group. In Jamaica, your doctor or the Ministry of Health can point you to services; in an emergency, call 119 or 110.'],['Planning a service','Decide on date, place, speakers and music; ask friends to help with food and logistics.'],['Writing an obituary','Include full name, dates, family, a short life summary and service details.'],['Supporting children in grief','Be honest in simple words, keep routines steady, and let them ask questions again and again.'],['Standing with Ukraine','We stand with our friends and colleagues in Ukraine. Please consider supporting recognised humanitarian organisations.']];
const LEGAL=(t,x)=>hero('Legal',t,'Last updated November 2026')+sec(`<div class="max-w-3xl mx-auto space-y-4 text-sm leading-relaxed">${x.map(s=>`<h3 class="font-semibold text-sky-950 dark:text-white">${s[0]}</h3><p>${s[1]}</p>`).join('')}<p class="text-xs text-slate-400">Draft text — please have it reviewed by a qualified professional before relying on it.</p></div>`);
const P={
home:()=>`<section class="relative bg-gradient-to-b from-sky-300/60 via-sky-100/70 to-white dark:from-sky-900 dark:via-neutral-950 dark:to-neutral-950 text-center px-4 py-16 sm:py-24"><div class="max-w-3xl mx-auto fade"><p class="text-xs font-bold tracking-widest text-sky-700 dark:text-sky-300">Trusted by 310,000+ families across 47 countries</p><h1 class="mt-3 text-4xl sm:text-6xl font-semibold tracking-tight text-sky-950 dark:text-white">Create a Memorial Website</h1><p class="mt-3 text-lg text-slate-600 dark:text-neutral-300">Preserve and share memories of your loved one</p><p class="mt-8 text-sm font-semibold text-sky-950 dark:text-white">I want to share memories of</p>${nameForm('h','GET STARTED')}<a href="#memorial-websites" class="inline-block mt-5 text-sm text-sky-700 dark:text-sky-300 underline">About online memorials ›</a></div></section>`
+sec(h2('Recent Online Memorials')+`<div class="grid grid-cols-2 md:grid-cols-4 gap-4">${mems().slice(0,4).map(card).join('')}</div>`)
+sec(`<h3 class="text-center font-semibold text-sky-950 dark:text-white mb-6">Our Community</h3><div class="grid grid-cols-3 gap-4 text-center">${[['Families',315859],['Visitors',229971388],['Tributes',6678542]].map(c=>`<div><div class="text-2xl sm:text-5xl font-bold text-sky-600" data-count="${c[1]}">0</div><div class="text-sm text-slate-500">${c[0]}</div></div>`).join('')}</div><p class="text-center mt-6"><a href="#find" class="text-sky-700 dark:text-sky-300 underline">Browse all online memorials ›</a></p>`,'bg-sky-50 dark:bg-neutral-900')
+sec(h2('Featured Categories')+`<div class="flex flex-wrap justify-center gap-3">${CATS.map(c=>`<a href="#find" data-cat="${esc(c)}" class="rounded-full border border-sky-200 dark:border-neutral-600 bg-white dark:bg-neutral-800 px-5 py-2.5 text-sm font-medium hover:bg-sky-500 hover:text-white hover:border-sky-500 transition">${c}</a>`).join('')}</div>`)
+sec(`<h2 class="text-center text-2xl font-semibold text-sky-950 dark:text-white">Loved by families everywhere</h2><p class="text-center text-slate-500 mt-2">Easy to use, affordable, and always there — a place for every memory, forever.</p><div class="max-w-2xl mx-auto mt-8 text-center"><div class="text-amber-400 text-xl">★★★★★</div><blockquote id="tq" class="mt-3 italic text-lg"></blockquote><p id="ta" class="mt-3 font-semibold text-sky-700"></p><div class="mt-4 flex justify-center gap-3"><button data-tp="-1" aria-label="Previous" class="w-10 h-10 rounded-full border border-sky-200 hover:bg-sky-50 dark:hover:bg-neutral-800">‹</button><button data-tp="1" aria-label="Next" class="w-10 h-10 rounded-full border border-sky-200 hover:bg-sky-50 dark:hover:bg-neutral-800">›</button></div><a href="#testimonials" class="inline-block mt-6 text-sky-700 dark:text-sky-300 underline">Read more stories ›</a></div>`,'bg-sky-50 dark:bg-neutral-900')
+`<section class="bg-gradient-to-r from-sky-600 to-emerald-600 text-white text-center px-4 py-14"><h2 class="text-2xl sm:text-3xl font-semibold">Start sharing memories today:</h2>${nameForm('c','BEGIN')}</section>`,
about:()=>hero('Our story','A gentle home for every memory','Sweet Solace began with a simple belief: no memory should ever fade. We give families a beautiful, lasting place to gather photos, stories and love — together, from anywhere.')+sec(`<h2 class="text-2xl font-semibold text-sky-950 dark:text-white text-center">Why families choose Sweet Solace</h2><p class="max-w-2xl mx-auto text-center mt-3 text-slate-500">Losing someone you love is hard. Keeping their story alive shouldn’t be. Create a heartfelt online memorial in minutes — no technical skills needed — and invite everyone who loved them to contribute.</p><div class="grid md:grid-cols-3 gap-5 mt-8">${[['Easy for everyone','Add photos, videos, candles, stories and tributes in a few clicks — on any device.'],['Affordable forever','One simple lifetime option keeps the memorial online for generations.'],['Bring everyone together','Family and friends near and far can visit, share and remember.']].map(c=>`<div class="rounded-2xl border border-sky-100 dark:border-neutral-700 bg-sky-50/60 dark:bg-neutral-900 p-6"><div class="text-sky-500 text-xl">✓</div><h3 class="font-semibold text-sky-950 dark:text-white mt-2">${c[0]}</h3><p class="text-sm text-slate-500 mt-1">${c[1]}</p></div>`).join('')}</div><div class="mt-8 flex justify-center gap-3 flex-wrap"><a href="#create" class="${btn}">CREATE A MEMORIAL</a><a href="#plans" class="rounded-lg border border-sky-300 px-7 py-3.5 text-sm font-semibold">See plans</a></div>`)+sec(h2('By the numbers')+`<div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">${[['310k+','Families'],['47','Countries'],['6.6M','Tributes shared'],['230M','Visits']].map(c=>`<div><div class="text-4xl font-bold text-sky-600">${c[0]}</div><div class="text-sm text-slate-500">${c[1]}</div></div>`).join('')}</div>`,'bg-sky-50 dark:bg-neutral-900'),
'memorial-websites':()=>hero('Memorial websites','What is an online memorial?','A private or public page where family and friends gather to remember a life.')+sec(`<div class="grid md:grid-cols-2 gap-5">${[['A place for every memory','Photos, videos, life story, dates and a favorite quote — all in one beautiful page.'],['Light candles & leave tributes','Visitors can light a virtual candle and write a message that stays forever.'],['Share one link','No accounts needed to visit. Family anywhere in the world can contribute.'],['Yours to keep','Start free and choose a simple lifetime plan when you’re ready.']].map(c=>`<div class="rounded-2xl border border-sky-100 dark:border-neutral-700 p-6"><h3 class="font-semibold text-sky-950 dark:text-white">${c[0]}</h3><p class="text-sm text-slate-500 mt-1">${c[1]}</p></div>`).join('')}</div><div class="mt-8 flex justify-center gap-3 flex-wrap"><a href="#create" class="${btn}">CREATE A MEMORIAL</a><a href="#find" class="rounded-lg border border-sky-300 px-7 py-3.5 text-sm font-semibold">Find a memorial</a></div>`),

OMPARE PLANS</a></div>`)},

return hero('Admin',esc(m.name),'Manage this memorial')+sec(`<div class='max-w-3xl mx-auto space-y-6'><div class='flex flex-wrap gap-5'><a href='#memorial-${id}-about' class='${lk}'>View memorial ›</a><a href='#admin' class='${lk}'>All my memorials</a></div>
<div class='${box} flex items-center gap-5'><div class='w-24 h-24 rounded-full overflow-hidden shrink-0'>${av(m.name,'h-24',m.pic)}</div><div><label class='${btn} !py-2.5 !text-xs'>${m.pic?'CHANGE':'UPLOAD'} PORTRAIT<input type='file' accept='image/*' data-pic='${id}' class='hidden'></label>${m.pic?`<button data-rmpic='${id}' class='ml-3 text-xs text-red-600 underline'>Remove</button>`:''}<p class='text-xs text-slate-500 mt-2'>Square photos work best. The portrait replaces the initials everywhere.</p></div></div>
<form data-f='am' data-id='${id}' class='${box} grid sm:grid-cols-2 gap-3'><h2 class='sm:col-span-2 ${hd}'>Details</h2><div><label class='${lb}'>Name</label><input name='name' required value='${esc(m.name)}' class='${inp}'></div><div><label class='${lb}'>Category</label><select name='cat' class='${inp}'>${['Family','Veteran','Community hero'].map(c=>`<option ${c==m.cat?'selected':''}>${c}</option>`).join('')}</select></div><div><label class='${lb}'>Year born</label><input name='b' type='number' required value='${m.b}' class='${inp}'></div><div><label class='${lb}'>Year passed</label><input name='d' type='number' required value='${m.d}' class='${inp}'></div><div class='sm:col-span-2'><label class='${lb}'>Life story</label><textarea name='story' rows='6' class='${inp}'>${esc(m.story)}</textarea></div><div class='sm:col-span-2 flex items-center gap-3'><button class='${btn}'>SAVE CHANGES</button><span id='amm' class='text-sm text-sky-600'></span></div></form>
<div class='${box}'><h2 class='${hd}'>Tributes (${d.t.length})</h2>${d.t.map((t,i)=>`<div class='${row}'><span>${esc(t.m)} <i class='text-slate-500'>— ${esc(t.n)}</i></span>${x('dt',t.k)}</div>`).join('')||no}</div>
<div class='${box}'><h2 class='${hd}'>Photos (${d.ph.length})</h2>${d.ph.length?`<div class='grid grid-cols-3 sm:grid-cols-4 gap-3 mt-3'>${d.ph.map((p,i)=>`<div class='relative'><img src='${p}' alt='' class='rounded-lg w-full h-28 object-cover'><button data-dp='${id}:${p.split('/').pop()}' class='absolute top-1 right-1 rounded bg-red-600 text-white text-xs px-2 py-0.5'>Delete</button></div>`).join('')}</div>`:no}</div>
<div class='${box}'><h2 class='${hd}'>Timeline moments (${d.ev.length})</h2>${d.ev.map((e,i)=>`<div class='${row}'><span>${esc(e.y)} — ${esc(e.t)}</span>${x('de',e.k)}</div>`).join('')||no}</div>
<div class='${box} border-red-200'><h2 class='font-semibold text-lg text-red-700'>Delete memorial</h2><p class='text-sm text-slate-500 mt-1'>This permanently removes the memorial, its tributes and photos.</p><button data-del='${id}' class='mt-3 rounded-lg bg-red-600 text-white text-sm font-semibold px-5 py-2.5'>Delete memorial</button></div></div>`)}
Object.assign(FORMS,{am:async(d,f)=>{try{await api('memorials/'+f.dataset.id,{method:'PATCH',body:{name:d.name,b:+d.b,d:+d.d,cat:d.cat,story:d.story}});await route();const s=$('#amm');if(s)s.textContent='Saved ✓'}catch(e){fmsg(f,e.message)}}});
document.addEventListener('change',e=>{const i=e.target,f=i.files&&i.files[0];if(!f)return;if(i.dataset.pic)sq(f,u=>mut(()=>api('memorials/'+i.dataset.pic+'/pic',{method:'PUT',body:{pic:u}})));if(i.dataset.cpic!==undefined)sq(f,u=>{S.draft.pic=u;const s=$('#cpm');if(s)s.textContent='Portrait added ✓'})});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const D=t.dataset,sp=v=>{const i=v.lastIndexOf(':');return[v.slice(0,i),v.slice(i+1)]};
if(D.rmpic)mut(()=>api('memorials/'+D.rmpic+'/pic',{method:'PUT',body:{pic:''}}));
if(D.dt){const[i,k]=sp(D.dt);mut(()=>api('memorials/'+i+'/tributes/'+k,{method:'DELETE'}))}
if(D.dp){const[i,k]=sp(D.dp);mut(()=>api('memorials/'+i+'/photos/'+k,{method:'DELETE'}))}
if(D.de){const[i,k]=sp(D.de);mut(()=>api('memorials/'+i+'/events/'+k,{method:'DELETE'}))}
if(D.del){if(!D.arm){t.dataset.arm='1';t.textContent='Click again to confirm deletion';return}api('memorials/'+D.del,{method:'DELETE'}).then(()=>{DB.list=null;go('admin')}).catch(er=>alert(er.message))}});
Object.assign(FORMS,{ev:async(d,f)=>{try{await api('memorials/'+f.dataset.id+'/events',{method:'POST',body:{y:+d.y,t:d.t,x:d.x}});route()}catch(e){fmsg(f,e.message)}},es:async(d,f)=>{try{await api('memorials/'+f.dataset.id,{method:'PATCH',body:{name:getM(f.dataset.id).name,b:getM(f.dataset.id).b,d:getM(f.dataset.id).d,cat:getM(f.dataset.id).cat,story:d.story}});route()}catch(e){fmsg(f,e.message)}}});
document.addEventListener('change',e=>{const i=e.target.closest('[data-ph]');if(!i)return;const id=i.dataset.ph,fs=[...i.files];mut(async()=>{for(const file of fs){const u=await new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(file)});await api('memorials/'+id+'/photos',{method:'POST',body:{photo:u}})}})});
const pathFor=n=>{let m;if(n=='home')return '/';if(P[n]||n=='admin')return '/'+n;if(m=n.match(/^admin-(.+)$/))return '/admin/'+m[1];if(m=n.match(/^memorial-(.+)-(about|timeline|photos|tributes)$/))return '/'+m[1]+'/'+m[2];if(m=n.match(/^memorial-(.+)$/))return '/'+m[1];return '/'+n};
const curH=()=>{const s=location.pathname.split('/').filter(Boolean).map(decodeURIComponent);if(!s.length)return 'home';if(s[0]=='admin')return s[1]?'admin-'+s[1]:'admin';if(s.length==1)return P[s[0]]?s[0]:'memorial-'+s[0]+'-about';return 'memorial-'+s[0]+'-'+s[1]};
const nav=n=>{const p=pathFor(n);if(p!=location.pathname)history.pushState({},'',p);route()};
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a||e.metaKey||e.ctrlKey||e.shiftKey)return;const n=a.getAttribute('href').slice(1);if(!n)return;e.preventDefault();nav(n)});
const post=(name,f)=>fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({'form-name':name,...f}).toString()}).catch(()=>{});
FORMS.ct=d=>{const o=$('#ctm');o.textContent='Sending…';fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({'form-name':'contact',name:d.n,email:d.e,message:d.m}).toString()}).then(r=>{if(!r.ok)throw 0;o.textContent='Thank you — your message has been sent.';$('[data-f=ct]').reset()}).catch(()=>{o.textContent='Sorry, something went wrong. Please email admin@karatechnix.com.'})};
window.addEventListener('popstate',route);me().then(()=>{$('#app').innerHTML=shell();route()});
</script></body></html>
