const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const SEED=[['bruce-warburton','Bruce Warburton',1948,2026,'Family'],['richard-john-parrott','Richard John Parrott',1965,2026,'Veteran'],['francis-zvomuya','Dr. Francis Zvomuya',1964,2026,'Community hero'],['nguby-naz-ngu','Nguby Naz Ngu',1969,2026,'Family'],['jinny-henson','Jinny Henson',1950,2026,'Family'],['margaret-ellis','Margaret Ellis',1938,2025,'Community hero'],['theodore-p-hill','Theodore P. Hill',1943,2026,'Veteran'],['claire-bennett','Claire Bennett',1990,2025,'Family']].map(a=>({id:a[0],name:a[1],b:a[2],d:a[3],cat:a[4],story:'A beloved presence in the lives of everyone who knew them. Friends and family gather here to share photos, stories and love — and to keep their memory shining.'}));
const CATS=['COVID-19 victims','Veterans','First responders','Substance abuse victims','Cancer victims','Victims of an accident','Crime victims','Miscarriage, stillborn and infant loss','Child loss'];
let S={q:'',f:'All',draft:{},user:null};
const DB={list:null,rec:{},det:{},seen:new Set()};
const api=async(p,o={})=>{const r=await fetch('/api/'+p,{method:o.method||'GET',credentials:'same-origin',headers:o.body?{'Content-Type':'application/json'}:{},body:o.body?JSON.stringify(o.body):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(j.error||'Something went wrong. Please try again.'),{status:r.status});return j};
const me=async()=>{try{const r=await api('me');S.user=r.email||null;S.siteOwner=!!r.siteOwner;S.ownerHint=r.ownerHint||null}catch(e){S.user=null;S.siteOwner=false;S.ownerHint=null}};
const loadList=async()=>{try{DB.list=(await api('memorials')).list}catch(e){DB.list=DB.list||[]}};
const loadDetail=async id=>{try{const q=DB.seen.has(id)?'':'?visit=1';DB.seen.add(id);const r=await api('memorials/'+encodeURIComponent(id)+q);DB.det[id]={...r.stats,music:r.stats.music||r.m?.music||'',musicOn:!!r.stats.musicOn,tributeMode:r.stats.tributeMode||'open',isPrivate:!!(r.m?.isPrivate)};if(r.m)DB.rec[id]=r.m;else delete DB.rec[id]}catch(e){delete DB.rec[id];delete DB.det[id]}};
const mems=()=>[...(DB.list||[]),...SEED],data=()=>DB.det;
const getM=id=>DB.rec[id]||mems().find(q=>q.id==id);
const fmsg=(f,t)=>{let p=f.querySelector('.fmsg');if(!p){p=document.createElement('p');p.className='fmsg text-sm text-red-600 sm:col-span-2';f.appendChild(p)}p.textContent=t};
const hue=n=>[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
const av=(n,c='h-40',p,ac)=>p?`<img src='${p}' alt='${esc(n)}' class='${c} w-full object-cover'>`:`<div class="${c} w-full flex items-center justify-center text-4xl font-semibold text-white" style="background:${ac?`linear-gradient(135deg,${ac},${ac}99)`:`linear-gradient(135deg,hsl(${hue(n)} 55% 62%),hsl(${(hue(n)+40)%360} 60% 45%))`}">${esc(n.replace(/^Dr\. /,'').split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>`;
const card=m=>`<a href="#memorial-${m.id}" class="block rounded-2xl overflow-hidden border border-sky-100 dark:border-neutral-700 bg-white dark:bg-neutral-900 shadow-md hover:shadow-xl hover:-translate-y-1 transition">${av(m.name,'h-40',m.pic,m.accentColor)}<div class="p-4"><h3 class="font-semibold text-sky-950 dark:text-white">${esc(m.name)}</h3><p class="text-xs text-slate-500">${m.b} – ${m.d} · ${esc(m.cat)}</p></div></a>`;
const btn='inline-block rounded-lg bg-sky-500 hover:bg-sky-600 text-white font-bold tracking-widest text-sm px-7 py-3.5 shadow-lg shadow-sky-200 dark:shadow-none transition cursor-pointer text-center';
const inp='mt-1.5 w-full rounded-lg border border-sky-200 dark:border-neutral-700 bg-sky-50/50 dark:bg-neutral-800 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400';
const fld=(l,n,t='text',ph='',req=1)=>`<div><label class="text-sm font-semibold text-sky-950 dark:text-neutral-100">${l}${req?' <span class="text-sky-500">*</span>':''}</label><input name="${n}" type="${t}" ${req?'required':''} placeholder="${ph}" value="${esc(S.draft[n]||'')}" class="${inp}"></div>`;
const EYE_ON=`<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>`;

const TEST=[['April','I think it’s amazing to have a place to honor a loved one that doesn’t cost a fortune to keep going. It’s always there for me to add more things and let other people do the same — all of those memories in one place forever.'],['Marcus','Setting it up for my father took ten minutes. Now cousins from three countries add stories every week.'],['Denise','The candle feature gives our family a quiet way to be together on anniversaries, even from far away.'],['Samuel','Affordable, simple and beautiful. Exactly what we needed after a very hard year.']];
let PLANS=[['free','Free','$0','Free forever',['1 memorial page with portrait & dates','Life story & photo gallery (up to 6 photos)','Candles & tributes from visitors','Shareable public link','Basic support via email'],0],['lifetime','Lifetime','$79','One-time — no subscription',['Everything in Free','Unlimited photos & videos','Birthday & anniversary reminders','Kept online for generations','Priority email support','Password-protected private mode'],7900],['family','Family','$129','One-time — covers up to 5 memorials',['Everything in Lifetime','Up to 5 linked memorials','Invite co-editors for each memorial','Printable memorial book (PDF)','Dedicated support'],12900]];

const LEGAL=(t,x)=>hero('Legal',t,'Last updated November 2026')+sec(`<div class="max-w-3xl mx-auto space-y-4 text-sm leading-relaxed">${x.map(s=>`<h3 class="font-semibold text-sky-950 dark:text-white">${s[0]}</h3><p>${s[1]}</p>`).join('')}<p class="text-xs text-slate-400">Draft text — please have it reviewed by a qualified professional before relying on it.</p></div>`);
const P={
home:()=>`<section class="relative bg-gradient-to-b from-sky-300/60 via-sky-100/70 to-white dark:from-sky-900 dark:via-neutral-950 dark:to-neutral-950 text-center px-4 py-16 sm:py-24"><div class="max-w-3xl mx-auto fade"><p class="text-xs font-bold tracking-widest text-sky-700 dark:text-sky-300">Trusted by 310,000+ families across 47 countries</p><h1 class="mt-3 text-4xl sm:text-6xl font-semibold tracking-tight text-sky-950 dark:text-white">Create a Memorial Website</h1><p class="mt-3 text-lg text-slate-600 dark:text-neutral-300">Preserve and share memories of your loved one</p><p class="mt-8 text-sm font-semibold text-sky-950 dark:text-white">I want to share memories of</p>${nameForm('h','GET STARTED')}<a href="#memorial-websites" class="inline-block mt-5 text-sm text-sky-700 dark:text-sky-300 underline">About online memorials ›</a></div></section>`
+sec(h2('Recent Online Memorials')+`<div class="grid grid-cols-2 md:grid-cols-4 gap-4">${mems().slice(0,4).map(card).join('')}</div>`)
+sec(`<h3 class="text-center font-semibold text-sky-950 dark:text-white mb-6">Our Community</h3><div class="grid grid-cols-3 gap-4 text-center">${[['Families',315859],['Visitors',229971388],['Tributes',6678542]].map(c=>`<div><div class="text-2xl sm:text-5xl font-bold text-sky-600" data-count="${c[1]}">0</div><div class="text-sm text-slate-500">${c[0]}</div></div>`).join('')}</div><p class="text-center mt-6"><a href="#find" class="text-sky-700 dark:text-sky-300 underline">Browse all online memorials ›</a></p>`,'bg-sky-50 dark:bg-neutral-900')

+sec(`<h2 class="text-center text-2xl font-semibold text-sky-950 dark:text-white">Loved by families everywhere</h2><p class="text-center text-slate-500 mt-2">Easy to use, affordable, and always there — a place for every memory, forever.</p><div class="max-w-2xl mx-auto mt-8 text-center"><div class="text-amber-400 text-xl">★★★★★</div><blockquote id="tq" class="mt-3 italic text-lg"></blockquote><p id="ta" class="mt-3 font-semibold text-sky-700"></p><div class="mt-4 flex justify-center gap-3"><button data-tp="-1" aria-label="Previous" class="w-10 h-10 rounded-full border border-sky-200 hover:bg-sky-50 dark:hover:bg-neutral-800">‹</button><button data-tp="1" aria-label="Next" class="w-10 h-10 rounded-full border border-sky-200 hover:bg-sky-50 dark:hover:bg-neutral-800">›</button></div><a href="#testimonials" class="inline-block mt-6 text-sky-700 dark:text-sky-300 underline">Read more stories ›</a></div>`,'bg-sky-50 dark:bg-neutral-900')
+`<section class="bg-gradient-to-r from-sky-600 to-emerald-600 text-white text-center px-4 py-14"><h2 class="text-2xl sm:text-3xl font-semibold">Start sharing memories today:</h2>${nameForm('c','BEGIN')}</section>`,
about:()=>hero('Our story','A gentle home for every memory','Sweet Solace began with a simple belief: no memory should ever fade. We give families a beautiful, lasting place to gather photos, stories and love — together, from anywhere.')+sec(`<h2 class="text-2xl font-semibold text-sky-950 dark:text-white text-center">Why families choose Sweet Solace</h2><p class="max-w-2xl mx-auto text-center mt-3 text-slate-500">Losing someone you love is hard. Keeping their story alive shouldn’t be. Create a heartfelt online memorial in minutes — no technical skills needed — and invite everyone who loved them to contribute.</p><div class="grid md:grid-cols-3 gap-5 mt-8">${[['Easy for everyone','Add photos, videos, candles, stories and tributes in a few clicks — on any device.'],['Affordable forever','One simple lifetime option keeps the memorial online for generations.'],['Bring everyone together','Family and friends near and far can visit, share and remember.']].map(c=>`<div class="rounded-2xl border border-sky-100 dark:border-neutral-700 bg-sky-50/60 dark:bg-neutral-900 p-6"><div class="text-sky-500 text-xl">✓</div><h3 class="font-semibold text-sky-950 dark:text-white mt-2">${c[0]}</h3><p class="text-sm text-slate-500 mt-1">${c[1]}</p></div>`).join('')}</div><div class="mt-8 flex justify-center gap-3 flex-wrap"><a href="#create" class="${btn}">CREATE A MEMORIAL</a><a href="#plans" class="rounded-lg border border-sky-300 px-7 py-3.5 text-sm font-semibold">See plans</a></div>`)+sec(h2('By the numbers')+`<div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">${[['310k+','Families'],['47','Countries'],['6.6M','Tributes shared'],['230M','Visits']].map(c=>`<div><div class="text-4xl font-bold text-sky-600">${c[0]}</div><div class="text-sm text-slate-500">${c[1]}</div></div>`).join('')}</div>`,'bg-sky-50 dark:bg-neutral-900'),
'memorial-websites':()=>hero('Memorial websites','What is an online memorial?','A private or public page where family and friends gather to remember a life.')+sec(`<div class="grid md:grid-cols-2 gap-5">${[['A place for every memory','Photos, videos, life story, dates and a favorite quote — all in one beautiful page.'],['Light candles & leave tributes','Visitors can light a virtual candle and write a message that stays forever.'],['Share one link','No accounts needed to visit. Family anywhere in the world can contribute.'],['Yours to keep','Start free and choose a simple lifetime plan when you’re ready.']].map(c=>`<div class="rounded-2xl border border-sky-100 dark:border-neutral-700 p-6"><h3 class="font-semibold text-sky-950 dark:text-white">${c[0]}</h3><p class="text-sm text-slate-500 mt-1">${c[1]}</p></div>`).join('')}</div><div class="mt-8 flex justify-center gap-3 flex-wrap"><a href="#create" class="${btn}">CREATE A MEMORIAL</a><a href="#find" class="rounded-lg border border-sky-300 px-7 py-3.5 text-sm font-semibold">Find a memorial</a></div>`),
create:()=>{const st=S.step||1,d=S.draft;return `<section class="bg-gradient-to-b from-sky-200/70 to-white dark:from-sky-950 dark:to-neutral-950 px-4 py-14"><div class="max-w-2xl mx-auto rounded-2xl bg-white/95 dark:bg-neutral-900 border border-sky-100 dark:border-neutral-700 shadow-2xl shadow-sky-200/60 dark:shadow-none p-6 sm:p-10 text-center fade"><p class="text-xs font-bold tracking-[0.2em] uppercase text-sky-600">Step ${st} of 3 — it takes a minute</p>`+(st==1?`<h1 class="mt-2 text-3xl font-semibold text-sky-950 dark:text-white">Who would you like to honor?</h1><p class="mt-3 text-slate-500">Enter their name to begin. You can add photos, dates and stories next — and change anything later.</p><form data-f="c1" class="mt-8 grid sm:grid-cols-2 gap-3 text-left">${fld('First Name','first_name','text','e.g. Margaret')}${fld('Last Name','last_name','text','e.g. Ellis')}${S.user?`<p class="sm:col-span-2 text-sm text-slate-500">Signed in as <b>${esc(S.user)}</b>.</p>`:`<div class="sm:col-span-2">${fld('Your email','email','email','you@example.com')}</div><div class="sm:col-span-2">${pwField('Create a password','password','new-password','At least 8 characters','<p class="text-xs text-slate-500 mt-1.5">This creates your account so only you can manage this memorial. Already have one? <a href=\\"#signin\\" class=\\"underline text-sky-600\\">Sign in</a>.</p>')}</div>`}<button class="${btn} sm:col-span-2">CREATE MY MEMORIAL ›</button></form>`:st==2?`<h1 class="mt-2 text-3xl font-semibold text-sky-950 dark:text-white">Tell us about ${esc(d.first_name)}</h1><form data-f="c2" class="mt-8 grid sm:grid-cols-2 gap-3 text-left">${fld('Year born','b','number','1950')}${fld('Year passed','d','number','2026')}<div class="sm:col-span-2"><label class="text-sm font-semibold">Category</label><select name="cat" class="${inp}"><option>Family</option><option>Veteran</option><option>Community hero</option></select></div><div class="sm:col-span-2"><label class="text-sm font-semibold">Their story</label><textarea name="story" rows="4" placeholder="Share a few words…" class="${inp}"></textarea></div><div class='sm:col-span-2'><label class='text-sm font-semibold'>Portrait (optional)</label><input type='file' accept='image/*' data-cpic class='${inp}'><p id='cpm' class='text-xs text-sky-600 mt-1'></p></div><div class='sm:col-span-2'><label class='text-sm font-semibold'>Memorial colour theme</label><div class='flex flex-wrap gap-2 mt-2'>${['#0ea5e9','#8b5cf6','#ec4899','#f59e0b','#10b981','#ef4444','#6366f1','#64748b'].map(c=>`<button type='button' data-pickcolor='${c}' style='background:${c};border-color:${(S.draft.accentColor||'#0ea5e9')===c?'white':'transparent'}' class='w-8 h-8 rounded-full border-2 hover:scale-110 transition ${(S.draft.accentColor||'#0ea5e9')===c?'ring-2 scale-110':''}'></button>`).join('')}</div><input type='hidden' name='accentColor' id='accentColorInput' value='${S.draft.accentColor||"#0ea5e9"}'></div><button class="${btn} sm:col-span-2">PUBLISH MEMORIAL ›</button></form>`:`<h1 class="mt-2 text-3xl font-semibold text-sky-950 dark:text-white">Your memorial is live 🕊️</h1><p class="mt-3 text-slate-500">Share the link with family and friends.</p><a href="#memorial-${S.newId}" class="${btn} mt-6">VIEW MEMORIAL</a> <a href="#admin-${S.newId}" class="${btn} mt-6">MANAGE MEMORIAL</a>`)+`</div></section>`+sec(h2('How it works')+`<div class="grid md:grid-cols-3 gap-5">${[['Name your memorial','Just a first and last name. Add dates, a portrait and a quote whenever you’re ready.'],['Add memories','Write their story, light candles and share milestones.'],['Invite family','Share one link. Loved ones add tributes and keep the story growing.']].map((c,i)=>`<div class="rounded-2xl border border-sky-100 dark:border-neutral-700 bg-sky-50/60 dark:bg-neutral-900 p-7 text-center"><span class="inline-flex w-11 h-11 rounded-full bg-sky-500 text-white font-bold items-center justify-center">${i+1}</span><h3 class="mt-4 font-semibold text-sky-950 dark:text-white // ---- Lightbox ----
let LB={imgs:[],idx:0};
function lbOpen(imgs,idx){LB={imgs,idx};lbShow()}
function lbShow(){const lb=$('#lb'),img=$('#lb-img'),cap=$('#lb-cap');if(!lb)return;img.src=LB.imgs[LB.idx]||'';cap.textContent=(LB.idx+1)+' / '+LB.imgs.length;lb.classList.remove('hidden');document.body.style.overflow='hidden'}
function lbClose(){const lb=$('#lb');if(lb)lb.classList.add('hidden');document.body.style.overflow=''}
function lbStep(d){LB.idx=(LB.idx+d+LB.imgs.length)%LB.imgs.length;lbShow()}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='lb-close'||t.id==='lb')lbClose();
  if(t.id==='lb-prev')lbStep(-1);
  if(t.id==='lb-next')lbStep(1);
});
// Capture-phase listener fires before the nav link handler — gallery images only
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.tagName==='IMG'&&t.closest('[data-photo-gallery]')){
    const gallery=t.closest('[data-photo-gallery]');
    const imgs=[...gallery.querySelectorAll('img')].map(i=>i.src);
    const idx=Math.max(0,imgs.indexOf(t.src));
    lbOpen(imgs,idx);
    e.stopPropagation(); // prevent the nav link handler from also firing
    e.preventDefault();
  }
},true); // true = capture phase
document.addEventListener('keydown',e=>{
  const lb=$('#lb');if(!lb||lb.classList.contains('hidden'))return;
  if(e.key==='Escape')lbClose();
  if(e.key==='ArrowLeft')lbStep(-1);
  if(e.key==='ArrowRight')lbStep(1);
});

async function loadSiteAdminData(){
if(!SA_CFG){try{const r=await api('site-config');SA_CFG=r.config;if(curH()==='site-admin')draw()}catch(e){}}
const rDiv=$('#sa-refunds'),uDiv=$('#sa-users');if(!rDiv&&!uDiv)return;try{const r=await api('site-admin/refunds');if(rDiv)rDiv.innerHTML=r.list.length?r.list.map(x=>`<div class='mt-3 p-4 rounded-xl bg-amber-50 dark:bg-neutral-800 flex flex-col sm:flex-row gap-3 justify-between'><div><p class='font-semibold'>${esc(x.email)}</p><p class='text-sm text-slate-500'>${esc(x.plan)} · ${esc(x.reason)}</p><p class='text-xs text-slate-400'>${new Date(x.date).toLocaleDateString()}</p></div><div class='flex gap-2'><button data-refund-approve='${x.id}' class='rounded-lg bg-emerald-600 text-white text-xs font-semibold px-3 py-1.5'>Approve</button><button data-refund-decline='${x.id}' class='rounded-lg bg-slate-500 text-white text-xs font-semibold px-3 py-1.5'>Decline</button></div></div>`).join(''):'<p class="text-sm text-slate-500 mt-2">No pending requests.</p>'}catch(e){if(rDiv)rDiv.innerHTML=''}
try{const r=await api('site-admin/users');if(uDiv)uDiv.innerHTML=r.list.length?`<div class='overflow-x-auto mt-2'><table class='w-full text-sm'><thead><tr class='text-left text-slate-400 border-b'><th class='pb-2 pr-4'>Email</th><th class='pb-2 pr-4'>Plan</th><th class='pb-2 pr-4'>Signed up</th><th class='pb-2'></th></tr></thead><tbody>${r.list.map(u=>`<tr class='border-b border-sky-50 dark:border-neutral-800'><td class='py-2 pr-4'>${esc(u.email)}</td><td class='pr-4'>${esc(u.plan||'free')}</td><td class='pr-4'>${new Date(u.created).toLocaleDateString()}</td><td class='py-2 text-right'><button data-del-user='${esc(u.email)}' class='text-xs text-red-600 hover:text-red-700 underline'>Delete</button></td></tr>`).join('')}</tbody></table><p class='text-xs text-slate-400 mt-2'>Deleting a user also deletes all memorials they owned.</p></div>`:'<p class="text-sm text-slate-500 mt-2">No signups yet.</p>'}catch(e){}
}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.refundApprove)api('site-admin/refunds/'+t.dataset.refundApprove+'/approve',{method:'POST'}).then(loadSiteAdminData).catch(er=>alert(er.message));if(t.dataset.refundDecline)api('site-admin/refunds/'+t.dataset.refundDecline+'/decline',{method:'POST'}).then(loadSiteAdminData).catch(er=>alert(er.message));});
window.addEventListener('popstate',route);
// Disarm any armed (two-click-confirm) buttons. Restores each button's// original text and visual state so a user who clicked Delete once and// changed their mind sees the button return to its normal state when// they click elsewhere or press Escape.const disarm=()=>{document.querySelectorAll('[data-arm="1"]').forEach(b=>{delete b.dataset.arm;if(b.dataset.origText){b.textContent=b.dataset.origText;delete b.dataset.origText}b.classList.remove('!bg-red-800','!text-red-800','!font-bold');b.disabled=false})};// Capture-phase click: if the click target is not inside an armed// button, disarm everything. Runs before the main bubble-phase click// handler so the click never reaches an armed button's handler unless// the click was actually on that button.document.addEventListener('click',e=>{if(!e.target.closest('[data-arm="1"]'))disarm()},true);// Escape key disarms any armed button.document.addEventListener('keydown',e=>{if(e.key==='Escape')disarm()});// Boot: render shell once, then load user session, then route
$('#app').innerHTML=curH()==='site-admin'?`<div id="sa-shell" class="min-h-screen bg-sky-50 dark:bg-neutral-950 text-slate-700 dark:text-neutral-200"><header class="bg-sky-950 text-white px-4 py-3 flex items-center justify-between"><a href="/site-admin" class="font-bold tracking-wider">🔐 Sweet Solace · Site Admin</a><a href="/" class="text-xs text-sky-200 hover:text-white">← Back to public site</a></header><main id="view" role="main" class="max-w-5xl mx-auto px-4 py-10"></main><footer class="px-4 py-6 text-center text-xs text-slate-400">© 2026 Sweet Solace · Site Owner Portal</footer></div>`:shell();
Promise.all([me(),api('site-config').then(r=>{if(r.config?.plans)PLANS=r.config.plans}).catch(()=>{})]).then(()=>{
  // Refresh header (sign-in state) without wiping the whole app
  if(curH()!=='site-admin'){
    const oldHeader=document.querySelector('header');
    const tmp=document.createElement('div');tmp.innerHTML=shell();
    const newHeader=tmp.querySelector('header');
    if(oldHeader&&newHeader)oldHeader.replaceWith(newHeader);
  }
  route();
});
</script></body></html>
