[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API requests go to the function (must come before the catch-all below).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# HandyPay webhook (alternative path HandyPay may call)
[[redirects]]
  from = "/webhook/handypay"
  to = "/.netlify/functions/api/webhook"
  status = 200
  force = true

# Clean URLs (/plans, /bruce-warburton/about, /admin ...) are handled in the browser.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
